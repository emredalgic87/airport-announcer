<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="manifest.webmanifest"><title>Airport Announcer</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;color:#10213a}.top{background:#0b1f3a;color:#fff;padding:24px 18px 20px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;opacity:.8}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #00000012}label{display:block;font-weight:700;margin:14px 0 7px}select,input{width:100%;font-size:17px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}button{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:800;margin-top:14px}.make{background:#0b1f3a;color:white}.speak{background:#e8eef7;color:#0b1f3a}.stop{background:#f1f1f1;color:#333}.out{margin-top:16px;padding:15px;min-height:120px;background:#f7f9fc;border-radius:12px;white-space:pre-wrap;line-height:1.5}.hint{font-size:13px;color:#64748b;margin-top:12px}</style></head><body><div class="top"><h1>✈️ Airport Announcer</h1><p>Delay Service Announcement</p></div><div class="wrap"><div class="card"><label>Havayolu</label><select id="airline"><option>Pobeda Airlines</option><option>S7 Airlines</option><option>Azimuth Airlines</option><option>Red Wings Airlines</option><option>GetJet Airlines</option><option>Avion Express Airlines</option><option>Belavia Airlines</option><option>Heston Airlines</option><option>Flynas Airlines</option></select><label>Sefer numarası</label><input id="flight" placeholder="Örn. DP860" autocapitalize="characters"><label>Restoran / hizmet noktası / Gate</label><input id="place" placeholder="Örn. SBARRO veya Gate 210"><label>Anons dili</label><select id="lang"><option value="ru-RU">🇷🇺 Rusça</option><option value="en-US">🇬🇧 İngilizce</option><option value="tr-TR">🇹🇷 Türkçe</option></select><button class="make" id="make">ANONSU HAZIRLA</button><div class="out" id="out">Bilgileri girip “Anonsu Hazırla” butonuna basın.</div><button class="speak" id="speak">🔊 ANONSU OKUT</button><button class="stop" id="stop">■ DURDUR</button><div class="hint">Ses iPhone’un sistem seslerinden seçilir. Rusça anons için cihazda Rusça ses mevcutsa otomatik kullanılır.</div></div></div><script>
const $=id=>document.getElementById(id);let text='';
function build(){const a=$('airline').value,f=$('flight').value.trim().toUpperCase(),p=$('place').value.trim(),l=$('lang').value;if(!f||!p){text='Lütfen sefer numarası ve hizmet noktasını girin.';$('out').textContent=text;return;}if(l==='ru-RU') text=`Уважаемые пассажиры рейса ${f} авиакомпании ${a}. Бесплатное питание и напитки предоставляются в пункте обслуживания ${p}. Для получения обслуживания, пожалуйста, предъявите посадочный талон.`;else if(l==='en-US') text=`Attention please. Passengers travelling on ${a} flight ${f} may receive complimentary food and beverages at ${p}. Please present your boarding pass to receive the service.`;else text=`Sayın yolcularımız, ${a} ${f} sefer sayılı uçuşun yolcuları, biniş kartlarını ibraz ederek ${p} noktasından ücretsiz yiyecek ve içecek hizmeti alabilirler.`;$('out').textContent=text;}
function speak(){build();if(!text||text.startsWith('Lütfen'))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),lang=$('lang').value;u.lang=lang;const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase()===lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(v)u.voice=v;u.rate=.88;u.pitch=1;speechSynthesis.speak(u)}
$('make').addEventListener('click',build);$('speak').addEventListener('click',speak);$('stop').addEventListener('click',()=>speechSynthesis.cancel());if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
