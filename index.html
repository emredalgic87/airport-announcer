<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="manifest.webmanifest"><title>Airport Announcer</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;color:#10213a}.top{background:#0b1f3a;color:#fff;padding:24px 18px 20px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;opacity:.8}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #00000012}label{display:block;font-weight:700;margin:14px 0 7px}select,input{width:100%;font-size:17px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}button{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:800;margin-top:14px}.make{background:#0b1f3a;color:white}.speak{background:#e8eef7;color:#0b1f3a}.stop{background:#f1f1f1;color:#333}.out{margin-top:16px;padding:15px;min-height:120px;background:#f7f9fc;border-radius:12px;white-space:pre-wrap;line-height:1.5}.hint{font-size:13px;color:#64748b;margin-top:12px}</style></head><body><div class="top"><h1>✈️ Airport Announcer</h1><p>Delay Service Announcement</p></div><div class="wrap"><div class="card"><label>Havayolu</label><select id="airline"><option>Pobeda Airlines</option><option>S7 Airlines</option><option>Azimuth Airlines</option><option>Red Wings Airlines</option><option>GetJet Airlines</option><option>Avion Express Airlines</option><option>Belavia Airlines</option><option>Heston Airlines</option><option>Flynas Airlines</option></select><label>Sefer numarası</label><input id="flight" placeholder="Örn. DP860" autocapitalize="characters"><label>Varış noktası</label><input id="destination" placeholder="Örn. Казань / Kazan" autocomplete="off"><label>Restoran / hizmet noktası / Gate</label><input id="place" placeholder="Örn. Анатолия, SBARRO veya Gate 210"><label>Anons dili</label><select id="lang"><option value="ru-RU">🇷🇺 Rusça</option><option value="en-US">🇬🇧 İngilizce</option><option value="tr-TR">🇹🇷 Türkçe</option></select><button class="make" id="make">ANONSU HAZIRLA</button><div class="out" id="out">Bilgileri girip “Anonsu Hazırla” butonuna basın.</div><button class="speak" id="speak">🔊 ANONSU OKUT</button><button class="stop" id="stop">■ DURDUR</button><div class="hint">Ses iPhone’un sistem seslerinden seçilir. Rusça anons için cihazda Rusça ses mevcutsa otomatik kullanılır.</div></div></div><script>
const $=id=>document.getElementById(id);let text='';
const airlineNames={
  'Pobeda Airlines':{ru:'Победа',en:'Pobeda Airlines',tr:'Pobeda Havayolları'},
  'S7 Airlines':{ru:'S7 Airlines',en:'S7 Airlines',tr:'S7 Airlines'},
  'Azimuth Airlines':{ru:'Азимут',en:'Azimuth Airlines',tr:'Azimuth Airlines'},
  'Red Wings Airlines':{ru:'Red Wings',en:'Red Wings Airlines',tr:'Red Wings Airlines'},
  'GetJet Airlines':{ru:'GetJet Airlines',en:'GetJet Airlines',tr:'GetJet Airlines'},
  'Avion Express Airlines':{ru:'Avion Express',en:'Avion Express Airlines',tr:'Avion Express Airlines'},
  'Belavia Airlines':{ru:'Белавиа',en:'Belavia Airlines',tr:'Belavia Havayolları'},
  'Heston Airlines':{ru:'Heston Airlines',en:'Heston Airlines',tr:'Heston Airlines'},
  'Flynas Airlines':{ru:'Flynas',en:'Flynas',tr:'Flynas'}
};
function cleanFlight(f){return f.trim().toUpperCase().replace(/^[A-Z0-9]{2}\s*-?\s*(?=\d)/,'')}
function build(){
 const a=$('airline').value,f=cleanFlight($('flight').value),d=$('destination').value.trim(),p=$('place').value.trim(),l=$('lang').value;
 if(!f||!d||!p){text='Lütfen sefer numarası, varış noktası ve hizmet noktasını girin.';$('out').textContent=text;return;}
 const names=airlineNames[a]||{ru:a,en:a,tr:a};
 const isGate=/^(gate|гейт|kapı)\s*\d+/i.test(p);
 if(l==='ru-RU'){
   if(isGate) text=`Уважаемые пассажиры!\nПассажиры рейса ${f} авиакомпании «${names.ru}» в ${d}, пожалуйста, пройдите к выходу ${p}, где вы получите воду и горячее питание.`;
   else text=`Уважаемые пассажиры!\nПассажиры рейса ${f} авиакомпании «${names.ru}» в ${d}, пожалуйста, пройдите в ресторан «${p}», где вы получите воду и горячее питание.`;
 } else if(l==='en-US'){
   if(isGate) text=`Dear passengers!\nPassengers travelling on flight ${f} of ${names.en} to ${d}, please proceed to ${p}, where you will receive water and a hot meal.`;
   else text=`Dear passengers!\nPassengers travelling on flight ${f} of ${names.en} to ${d}, please proceed to ${p} Restaurant, where you will receive water and a hot meal.`;
 } else {
   if(isGate) text=`Sayın yolcularımız!\n${names.tr}’nın ${d} varışlı ${f} sefer sayılı uçuşunun yolcularının, su ve sıcak yemek hizmeti için ${p} numaralı kapıya gitmeleri rica olunur.`;
   else text=`Sayın yolcularımız!\n${names.tr}’nın ${d} varışlı ${f} sefer sayılı uçuşunun yolcularının, su ve sıcak yemek hizmeti için ${p} Restoran’a gitmeleri rica olunur.`;
 }
 $('out').textContent=text;
}
function speak(){build();if(!text||text.startsWith('Lütfen'))return;speechSynthesis.cancel();const spokenText=text.replace(/[«»\"“”]/g,'').replace(/\s+/g,' ').trim();const u=new SpeechSynthesisUtterance(spokenText),lang=$('lang').value;u.lang=lang;const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase()===lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(v)u.voice=v;u.rate=.88;u.pitch=1;speechSynthesis.speak(u)}
$('make').addEventListener('click',build);$('speak').addEventListener('click',speak);$('stop').addEventListener('click',()=>speechSynthesis.cancel());if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
